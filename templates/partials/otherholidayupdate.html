{% load static %} 
<form
        action="{% url 'core:save_other_holiday'  %}"
        method="POST"
        class="tablelist-form"
        autocomplete="on"
      >
        {% csrf_token %}
        <div class="modal-body">
          <div class="row">
            <div class="col-lg-12">
              <div class="card">
                <div class="card-header align-items-center d-flex">
                  <h4 class="card-title mb-0 flex-grow-1">Polymath Holidays</h4>
                  
                </div>
                <!-- end card header -->
                <div class="card-body">
                  <div class="live-preview">
                    <div class="row gy-4">
                        <div class="col-sm-4">{{form.title}}</div>      
                        <div class="col-sm-4">{{form.start_date}}</div>
                        <div class="col-sm-4">{{form.end_date}}</div>
                        {{ form.id.as_hidden }}
                      <!--end col-->
                    </div>
                    <!--end row-->
                  </div>
                </div>
              </div>

            
            </div>
          </div>
        </div>
        <div class="modal-footer" style="display: block">
          <div class="hstack gap-2 justify-content-end">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">
              Close
            </button>
            <button class="btn btn-secondary" type="submit">Save </button>
            <!-- <button type="button" class="btn btn-success" id="edit-btn">Update</button> -->
          </div>
        </div>
      </form>
      <!-- jQuery -->
    
        <script>
        jQuery('#start_date').flatpickr();

        jQuery('#end_date').flatpickr();
        
      </script>
