{% load static %}
<form
  action="{% url 'core:update_additional_rates'  %}"
  method="POST"
  class="tablelist-form"
  autocomplete="on"
>
  {% csrf_token %}
  <div class="modal-body">
    <div class="row">
      <div class="col-lg-12">
        <div class="live-preview">
          <div class="mb-3">
            <label for="employeeName" class="form-label">From time</label>
            {{ formU.from_time }} {{ formU.id.as_hidden }}
          </div>
          <div class="mb-3">
            <label for="employeeUrl" class="form-label">To time</label>
            {{ formU.to_time }}
          </div>
          <div class="mb-3">
            <label for="StartleaveDate" class="form-label">Extra rate</label>
            <div>{{ formU.extra_rate }}</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Effective from</label>
            {{ formU.effective_from }}
          </div>
          <div class="mb-3">
            <label class="form-label">Effective to</label>
            {{ formU.effective_to }}
          </div>


        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer" style="display: block">
    <div class="hstack gap-2 justify-content-end">
      <button class="btn btn-secondary" type="submit">Save</button>
      <!-- <button type="button" class="btn btn-success" id="edit-btn">Update</button> -->
    </div>
  </div>
</form>
<script>
  jQuery("#from_time").flatpickr();
  jQuery("#to_time").flatpickr();
  // Effective dates: allow any date (incl. back-dated). Distinct ids avoid
  // clashing with the add form's #effective_from / #effective_to.
  jQuery("#effective_from_update").flatpickr();
  jQuery("#effective_to_update").flatpickr();

  // Guard against double submission (a rapid double-click was posting the edit
  // twice, creating duplicate rate-history rows).
  jQuery("#modelForm form").off("submit.noDouble").on("submit.noDouble", function () {
    var $f = jQuery(this);
    if ($f.data("submitted")) { return false; }
    $f.data("submitted", true);
    $f.find('button[type="submit"]').prop("disabled", true).text("Saving...");
  });
</script>
